<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown → Rich Text Clipboard</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --page-background: #f5f5f5;
      --text-color: #222;
      --surface-background: #fff;
      --input-border: #ccc;
      --preview-border: #ddd;
      --muted-text: #666;
      --code-background: #f4f4f4;
      --primary-background: #222;
      --primary-text: #fff;
      --javascript-background: #3157a4;
      --secondary-background: #ddd;
      --secondary-text: #222;
      --status-success: #18794e;
      --status-error: #b00020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page-background: #16181c;
        --text-color: #e7e9ea;
        --surface-background: #22252a;
        --input-border: #555b65;
        --preview-border: #454a52;
        --muted-text: #aeb4bd;
        --code-background: #181a1f;
        --primary-background: #e7e9ea;
        --primary-text: #181a1f;
        --javascript-background: #527bd0;
        --secondary-background: #454a52;
        --secondary-text: #f2f3f5;
        --status-success: #6bd89b;
        --status-error: #ff8e9c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-background);
      color: var(--text-color);
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 24px; }
    textarea {
      width: 100%;
      min-height: 300px;
      padding: 16px;
      resize: vertical;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--surface-background);
      color: var(--text-color);
    }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 24px; }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    #copyButton { background: var(--primary-background); color: var(--primary-text); }
    #copyJavaScriptButton { background: var(--javascript-background); color: #fff; }
    #clearButton { background: var(--secondary-background); color: var(--secondary-text); }
    #status { min-height: 24px; margin-bottom: 12px; font-size: 14px; }
    .preview-wrapper {
      background: var(--surface-background);
      border: 1px solid var(--preview-border);
      border-radius: 8px;
      padding: 24px;
    }
    .preview-wrapper h2 { margin-top: 0; font-size: 16px; color: var(--muted-text); }
    #preview { line-height: 1.6; }
    #preview pre {
      overflow-x: auto;
      padding: 12px;
      background: var(--code-background);
      border-radius: 6px;
    }
    #preview code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #preview blockquote {
      margin-left: 0;
      padding-left: 16px;
      border-left: 4px solid var(--input-border);
      color: var(--muted-text);
    }
    #preview table { border-collapse: collapse; }
    #preview th, #preview td { padding: 6px 10px; border: 1px solid var(--input-border); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Markdown → Rich Text Clipboard</h1>

    <textarea id="markdown" placeholder="input markdown here"></textarea>

    <div class="buttons">
      <button id="copyButton">Copy as rich text</button>
      <button id="copyJavaScriptButton">Copy JavaScript</button>
      <button id="clearButton">Clear</button>
    </div>

    <div id="status"></div>

    <div class="preview-wrapper">
      <h2>Preview</h2>
      <div id="preview"></div>
    </div>
  </div>

  <script>
    const markdownInput = document.getElementById("markdown");
    const preview = document.getElementById("preview");
    const copyButton = document.getElementById("copyButton");
    const copyJavaScriptButton = document.getElementById("copyJavaScriptButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");

    marked.setOptions({
      gfm: true,
      breaks: false
    });

    function markdownToHtml(markdown) {
      return marked.parse(markdown);
    }

    function updatePreview() {
      preview.innerHTML = markdownToHtml(markdownInput.value);
    }

    async function copyAsRichText() {
      const markdown = markdownInput.value;
      const html = markdownToHtml(markdown);

      try {
        if (
          navigator.clipboard &&
          typeof ClipboardItem !== "undefined" &&
          navigator.clipboard.write
        ) {
          const clipboardItem = new ClipboardItem({
            "text/html": new Blob(
              [createClipboardHtml(html)],
              { type: "text/html" }
            ),
            "text/plain": new Blob(
              [markdown],
              { type: "text/plain" }
            )
          });

          await navigator.clipboard.write([clipboardItem]);
          showStatus("Copy as rich textしました。");
          return;
        }

        fallbackCopy(html);
        showStatus("Copy as rich textしました。");
      } catch (error) {
        console.error(error);
        showStatus("Copy failed: " + error.message, true);
      }
    }

    function createPromptJavaScript(html) {
      const serializedHtml = JSON.stringify(html)
        .replace(/\u2028/g, "\\u2028")
        .replace(/\u2029/g, "\\u2029");

      return `(()=>{const e=document.querySelector("#prompt-textarea"),h=${serializedHtml};if(!e)throw new Error("#prompt-textarea not found");e.focus();if(e instanceof HTMLTextAreaElement||e instanceof HTMLInputElement){const s=e.selectionStart??e.value.length;e.setRangeText(h,s,e.selectionEnd??s,"end")}else{e.insertAdjacentHTML("beforeend",h)}e.dispatchEvent(new InputEvent("input",{bubbles:true,inputType:"insertText",data:null}))})()`;
    }

    async function copyJavaScript() {
      const javascript = createPromptJavaScript(
        markdownToHtml(markdownInput.value)
      );

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(javascript);
        } else {
          fallbackCopyText(javascript);
        }
        showStatus("Minified JavaScript copied.");
      } catch (error) {
        console.error(error);
        showStatus("Copy failed: " + error.message, true);
      }
    }

    function createClipboardHtml(content) {
      return `
        <!doctype html>
        <html>
          <body>
            ${content}
          </body>
        </html>
      `;
    }

    function fallbackCopy(html) {
      const container = document.createElement("div");
      container.contentEditable = "true";
      container.style.position = "fixed";
      container.style.left = "-9999px";
      container.innerHTML = html;

      document.body.appendChild(container);

      const range = document.createRange();
      range.selectNodeContents(container);

      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      const success = document.execCommand("copy");

      selection.removeAllRanges();
      container.remove();

      if (!success) {
        throw new Error("The browser rejected the copy operation");
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();

      const success = document.execCommand("copy");
      textarea.remove();

      if (!success) {
        throw new Error("The browser rejected the copy operation");
      }
    }

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "var(--status-error)" : "var(--status-success)";

      setTimeout(() => {
        status.textContent = "";
      }, 3000);
    }

    window.addEventListener("pageshow", updatePreview);
    markdownInput.addEventListener("input", updatePreview);
    copyButton.addEventListener("click", copyAsRichText);
    copyJavaScriptButton.addEventListener("click", copyJavaScript);
    clearButton.addEventListener("click", () => {
      markdownInput.value = "";
      updatePreview();
      markdownInput.focus();
    });

    updatePreview();
  </script>
</body>
</html>
